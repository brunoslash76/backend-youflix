apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: youflix-backend
resources:
  - ../../base
  - postgres.yaml
  - redis.yaml
  - minio.yaml
secretGenerator:
  - name: youflix-secrets
    envs:
      - .env.secrets
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: api-node-env-patch.yaml
    target:
      kind: Deployment
      name: youflix-backend-api
