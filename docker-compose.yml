services:
  # --- POSTGRES ---
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      start_period: 10s
      timeout: 5s
      retries: 5
    networks: 
    - app-network
  # --- APPLICATION SERVICE ---
  app:
    command: npm run start:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: node_app
    restart: always
    ports:
      - "3000:3000"
      - "9229:9229"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-app_db}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
    - app-network

  # --- REDIS ---
  redis:
    image: redis:7-alpine
    container_name: redis-server
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-rootpassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rootpassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
    - app-network

  # --- MINIO ---
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/youflix;
      mc anonymous set none local/youflix;
      mc anonymous set download local/youflix/thumbnails;
      mc cors set local/youflix /cors.json;
      "
    volumes:
      - ./docker/minio-cors.json:/cors.json:ro
    networks:
      - app-network

volumes:
  redis_data:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  app-network:
    driver: bridge