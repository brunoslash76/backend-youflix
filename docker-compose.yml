services:
  # --- POSTGRES ---
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      start_period: 10s
      timeout: 5s
      retries: 5
    networks: 
    - app-network
  # --- APPLICATION SERVICE ---
  app:
    command: npm run start:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: node_app
    restart: always
    ports:
      - "3000:3000"
      - "9229:9229"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-app_db}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
    - app-network

  # --- REDIS ---
  redis:
    image: redis:7-alpine
    container_name: redis-server
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-rootpassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rootpassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
    - app-network

volumes:
  redis_data:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge